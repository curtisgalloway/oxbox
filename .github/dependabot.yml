# Actions in ci.yml are pinned to commit SHAs, which is the point — a mutable
# tag lets whoever can retag run code in CI. Pinning without this file just
# means the pins go stale instead, so Dependabot owns keeping them current and
# each bump arrives as a reviewable PR with the version in the comment updated.
#
# No Python ecosystem entry: the Python scripts deliberately have no
# third-party dependencies, so there is nothing there to update. The Rust
# workspace does carry dependencies, all under oxbox-send (the TLS stack,
# JSON, the scanner's regex crate), so Cargo.lock gets the same treatment.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: cargo
    labels:
      - dependencies

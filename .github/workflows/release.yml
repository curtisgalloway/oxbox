# SPDX-License-Identifier: Apache-2.0

# Build the release packages and attach them to a GitHub Release when a v*
# tag is pushed, then ask the Homebrew tap to re-pin its formula.
# workflow_dispatch builds the packages as workflow artifacts only (no
# Release, no tap bump), for testing the pipeline.
#
# Three packages, one per platform: the Linux .deb, the macOS tarball, and the
# Windows MSI. All three are pure Python and arch-independent, so each is one
# build on the stock runner with no container and no cross-compilation.
#
# The Windows MSI is Authenticode-signed by Azure Artifact Signing when the
# repo is configured for it, and ships unsigned when it is not -- every
# signing step is gated on vars.AZURE_SIGNING_ACCOUNT. The account is shared
# across projects; onboarding this one is configuration, not a purchase, and
# the runbook is in ~/src/iac/mac-common/code-signing/README.md.
#
# Homebrew is the maintained macOS channel and is not built here -- the tap
# installs from the tag's source tarball, which is why the last job only has
# to tell it that a new tag exists. The macOS tarball ships the same prefix
# layout the formula installs, for people who do not use brew.
#
# The smoke tests are the part that earns trust -- each one installs its
# package for real and runs the full in-jail probe suite against the INSTALLED
# tools from a scratch directory, which exercises exactly what a package must
# get right: executables on PATH, working-directory anchoring, script-relative
# assets found under the prefix, and a jail that holds.

name: Release package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: 2.46.3

jobs:
  # One place decides what version is being built, so the two package jobs
  # cannot disagree about it, and the tag check runs once rather than per
  # platform.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~dev.$(printf '%.7s' "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          fi

      # A tag that disagrees with the tools' own VERSION would ship a package
      # whose --version lies about what it is. Refuse before building.
      - name: Check the tag matches the tools' VERSION
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(python3 ox --version)"
          if [ "$reported" != "ox ${VERSION}" ]; then
            echo "::error::tag says ${VERSION} but the tools say '${reported}'"
            exit 1
          fi

  deb:
    name: Debian package and smoke test
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo apt-get install -y /tmp/nfpm.deb

      - name: Build .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb \
            -t "dist/oxbox_${VERSION}_all.deb"

      - name: Install the .deb and its dependencies
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "./dist/oxbox_${VERSION}_all.deb"

      # Same knob ci.yml uses: Ubuntu 24.04's AppArmor patch restricts the
      # unprivileged user namespaces bubblewrap needs.
      - name: Permit unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke-test the installed tools from a scratch directory
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -x /usr/bin/ox
          test -x /usr/bin/oxbox
          test -x /usr/bin/oxapply
          test -x /usr/bin/oxseed
          test -f /usr/share/doc/oxbox/LICENSE
          scratch="$RUNNER_TEMP/smoke"
          mkdir -p "$scratch/srcrepo"
          echo 'print("hi")' > "$scratch/srcrepo/thing.py"
          cd "$scratch"
          # Against the checkout's own ox, not against ${VERSION}: on a
          # workflow_dispatch build the package version is 0.0.0~dev.<sha>
          # while the tools still report their baked-in VERSION, and the
          # version job has already refused any tag that disagrees with it.
          # What is being asserted here is that the tool on PATH is this
          # checkout's tool.
          expected="$(python3 "$GITHUB_WORKSPACE/ox" --version)"
          [ "$(/usr/bin/ox --version)" = "$expected" ]
          /usr/bin/oxseed "$scratch/srcrepo" thing.py
          # A dry run needs no key and proves logs land in the working
          # directory, not somewhere script-relative under /usr. --model is
          # explicit because no venue carries a default: this asserts where
          # the log lands, not how a model gets chosen, and a bare run is
          # supposed to refuse.
          /usr/bin/ox --model smoke-test --mode ask --dry-run "hello" > /dev/null
          test -f "$scratch"/logs/*/meta.json
          # --skill reads a packaged file, so it fails exactly when the
          # package forgets to ship one. It must also rewrite the runbook's
          # script paths to where they landed, or the commands it prints
          # name a .claude directory that does not exist here. All four
          # tools answer it, and wiretest already proves they agree in a
          # checkout — what only an installed system can show is that the
          # lookup still resolves from /usr/bin.
          for tool in ox oxbox oxseed oxapply; do
            "/usr/bin/$tool" --skill 2>/dev/null > "skill-$tool.md"
            grep -q '^name: ox-review' "skill-$tool.md"
            grep -q '/usr/share/oxbox/ox-review/scripts/preflight.py' "skill-$tool.md"
            cmp -s skill-ox.md "skill-$tool.md"
          done
          test -f /usr/share/oxbox/ox-review/scripts/exposure.py
          # The full in-jail probe suite, against the installed oxbox.
          cp "$GITHUB_WORKSPACE/jailtest.py" sandbox/work/jailtest.py
          /usr/bin/oxbox -- /usr/bin/python3 jailtest.py

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v7.0.1
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  macos:
    name: macOS tarball and smoke test
    needs: version
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No nfpm and no installer: the tarball IS the package. macOS ships
      # sandbox-exec and a python3, and the tools are stdlib-only, so there is
      # nothing to declare a dependency on and nothing to compile.
      - name: Build the tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          packaging/macos-tarball.sh "$VERSION" dist

      # Unpacked to a prefix under RUNNER_TEMP rather than over /usr/local, so
      # the smoke test proves what the artifact actually promises: extract it
      # anywhere and it works from there. find_profile and find_skill resolve
      # ../share/oxbox from the script, which is exactly the assumption that
      # breaks if the tarball's layout drifts.
      - name: Smoke-test the unpacked tools from a scratch directory
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prefix="$RUNNER_TEMP/prefix"
          mkdir -p "$prefix"
          tar xzf "dist/oxbox-${VERSION}-macos.tar.gz" -C "$prefix" \
            --strip-components 1
          test -x "$prefix/bin/ox"
          test -x "$prefix/bin/oxbox"
          test -x "$prefix/bin/oxapply"
          test -x "$prefix/bin/oxseed"
          test -f "$prefix/share/doc/oxbox/LICENSE"
          # The seatbelt profile, which the .deb has no reason to ship and a
          # macOS package has every reason to: without it oxbox refuses.
          test -f "$prefix/share/oxbox/jail.sb"
          scratch="$RUNNER_TEMP/smoke"
          mkdir -p "$scratch/srcrepo"
          echo 'print("hi")' > "$scratch/srcrepo/thing.py"
          cd "$scratch"
          expected="$(python3 "$GITHUB_WORKSPACE/ox" --version)"
          [ "$("$prefix/bin/ox" --version)" = "$expected" ]
          "$prefix/bin/oxseed" "$scratch/srcrepo" thing.py
          "$prefix/bin/ox" --mode ask --dry-run "hello" > /dev/null
          test -f "$scratch"/logs/*/meta.json
          for tool in ox oxbox oxseed oxapply; do
            "$prefix/bin/$tool" --skill 2>/dev/null > "skill-$tool.md"
            grep -q '^name: ox-review' "skill-$tool.md"
            grep -q "$prefix/share/oxbox/ox-review/scripts/preflight.py" \
              "skill-$tool.md"
            cmp -s skill-ox.md "skill-$tool.md"
          done
          test -f "$prefix/share/oxbox/ox-review/scripts/exposure.py"
          # The full in-jail probe suite, under seatbelt, against the
          # unpacked oxbox and the profile it found beside itself.
          cp "$GITHUB_WORKSPACE/jailtest.py" sandbox/work/jailtest.py
          "$prefix/bin/oxbox" -- /usr/bin/python3 jailtest.py

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v7.0.1
        with:
          name: macos-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows MSI and smoke test
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    # The signing identity federates on this environment's NAME, not on the
    # tag. Entra federated credentials take no wildcards, so a `refs/tags/*`
    # subject is impossible and a fixed string is the only thing that works;
    # `release` is that string, and it also means a signed release waits on
    # the environment's reviewer approval. Full runbook, including the traps
    # that fail silently, in ~/src/iac/mac-common/code-signing/README.md.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the WiX v7 CLI
        run: dotnet tool install --global wix

      # WiX v7 refuses to build anything until its Open Source Maintenance
      # Fee EULA is accepted (error WIX7015). The fee applies to consumers
      # generating revenue; this one does not.
      - name: Accept the WiX OSMF EULA
        run: wix eula accept wix7

      - name: Build the MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging\windows\build.ps1 -Version $env:VERSION -OutDir dist

      # The signing action wants an absolute path and the MSI name carries the
      # version, so resolve it once here rather than re-globbing per step.
      - name: Locate the MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      # ---- Signing. Every step skips while AZURE_SIGNING_ACCOUNT is unset,
      # so an un-onboarded repo (or a fork) ships an unsigned MSI instead of
      # failing. That is the right default and a trap for this repo: unset is
      # indistinguishable from working unless something checks the artifact,
      # which is what the verify step below is for.
      #
      # allow-no-subscriptions, and no subscription-id, on purpose: the
      # signing identity holds only Artifact Signing Certificate Profile
      # Signer, scoped to the profile, so an ordinary login enumerates zero
      # subscriptions and dies with "No subscriptions found" AFTER the OIDC
      # exchange succeeded -- which reads like an auth failure and is not one.
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # timestamp-rfc3161 has a default in v2.0.0 and is set anyway: these
      # certificates live 72 hours, so an untimestamped signature verifies on
      # release day and is invalid three days later on every copy already
      # downloaded. That must not rest on a third-party default staying put.
      - name: Sign the MSI
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.msi.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the MSI is signed and timestamped
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi.outputs.path }}
        run: |
          $sig = Get-AuthenticodeSignature $env:MSI_PATH
          Write-Host "$($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::the MSI is not validly signed (status: $($sig.Status))"
            exit 1
          }
          if (-not $sig.TimeStamperCertificate) {
            Write-Host "::error::the MSI has no RFC3161 timestamp; its signature dies with the 72-hour certificate"
            exit 1
          }
          Write-Host "timestamped by: $($sig.TimeStamperCertificate.Subject)"

      # Installed for real, from the same file that will be uploaded, and
      # exercised from a scratch directory -- the same shape as the .deb and
      # tarball smoke tests, plus the two things only Windows can show: that
      # the .cmd shims find their scripts, and that oxbox refuses.
      - name: Smoke-test the installed tools from a scratch directory
        shell: pwsh
        env:
          MSI_PATH: ${{ steps.msi.outputs.path }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP "install.log"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList `
            '/i', "`"$env:MSI_PATH`"", '/qn', '/l*v', "`"$log`""
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "msiexec install failed: $($p.ExitCode)"
          }
          $prefix = Join-Path $env:LOCALAPPDATA "Programs\oxbox"
          foreach ($tool in 'ox', 'oxbox', 'oxseed', 'oxapply') {
            if (-not (Test-Path "$prefix\bin\$tool")) { throw "no $tool in the install" }
            if (-not (Test-Path "$prefix\bin\$tool.cmd")) { throw "no $tool.cmd shim in the install" }
          }
          if (-not (Test-Path "$prefix\doc\LICENSE")) { throw "the package shipped no LICENSE" }
          if (-not (Test-Path "$prefix\share\oxbox\ox-review\scripts\exposure.py")) {
            throw "the package shipped an incomplete ox-review skill"
          }

          # Against the checkout's own ox for the same reason the other two
          # jobs do it: a workflow_dispatch build's package version is not the
          # tools' VERSION, and the version job already refused a tag that
          # disagreed.
          $expected = & python "$env:GITHUB_WORKSPACE\ox" --version
          $actual = & "$prefix\bin\ox.cmd" --version
          if ($actual -ne $expected) {
            throw "installed ox reports '$actual', this checkout says '$expected'"
          }

          $scratch = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force "$scratch\srcrepo" | Out-Null
          Set-Content "$scratch\srcrepo\thing.py" 'print("hi")'
          Set-Location $scratch
          & "$prefix\bin\oxseed.cmd" "$scratch\srcrepo" thing.py
          if ($LASTEXITCODE -ne 0) { throw "oxseed failed: $LASTEXITCODE" }
          # No key needed, and it proves the log lands in the working
          # directory rather than beside the scripts under LocalAppData.
          & "$prefix\bin\ox.cmd" --mode ask --dry-run hello > $null
          if ($LASTEXITCODE -ne 0) { throw "ox dry run failed: $LASTEXITCODE" }
          if (-not (Get-ChildItem "$scratch\logs\*\meta.json")) {
            throw "the run logged nothing into the working directory"
          }

          # stdout is captured and stderr is left alone, so each tool's
          # provenance line lands in the run log where it can be read. That
          # matters more than it looks: this step failed three times with a
          # bare "exit code 1" and no message, and the log was the only
          # instrument available.
          #
          # All four tools answer --skill, agree byte for byte, and name the
          # directory this installation actually put the runbook in. guardtest
          # asserts on the directory rather than a full script path because
          # the substitution leaves mixed separators on Windows: a backslash
          # prefix followed by the document's own forward slashes.
          $first = $null
          foreach ($tool in 'ox', 'oxbox', 'oxseed', 'oxapply') {
            $text = (& "$prefix\bin\$tool.cmd" --skill) -join "`n"
            if ($text -notmatch '(?m)^name: ox-review') {
              throw "$tool --skill did not print the runbook"
            }
            if (-not $text.Contains("$prefix\share\oxbox\ox-review")) {
              throw "$tool --skill did not rewrite the paths to this installation"
            }
            if ($null -eq $first) { $first = $text }
            elseif ($text -ne $first) { throw "$tool --skill disagrees with ox" }
          }

          # The Windows-only assertion, and the one that also proves the shim
          # propagates an exit code: there is no jail here, and oxbox says so
          # with EX_CONFIG rather than pretending to sandbox anything.
          #
          # This call is why the step ends with an explicit `exit 0` below.
          Write-Host "== asserting the refusal"
          & "$prefix\bin\oxbox.cmd" -- python -c "print(1)" > $null
          $refusal = $LASTEXITCODE
          Write-Host "== oxbox returned $refusal"
          if ($refusal -ne 78) {
            throw "oxbox should refuse on native Windows with exit 78, got $refusal"
          }

          Write-Host "== uninstalling"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$env:MSI_PATH`"", '/qn'
          if ($p.ExitCode -ne 0) { throw "msiexec uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$prefix\bin\ox") { throw "uninstall left the tools behind" }

          # Explicitly, and this is the whole reason the step took four
          # attempts. GitHub's pwsh shell appends `exit $LASTEXITCODE` to
          # every script, and the refusal assertion above deliberately leaves
          # 78 in there -- so the step failed AFTER every assertion had
          # passed, with no error text, because nothing had errored. Every
          # assertion here is a throw, so the only correct ending is a zero of
          # our own. Any step that runs a tool expected to exit non-zero needs
          # this line.
          Write-Host "== ok"
          exit 0

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v7.0.1
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  release:
    name: publish the GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, deb, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # All three packages into one directory, so the release step can take
      # the whole thing and no platform can be quietly left off the page.
      # One job owns the release notes for the same reason: two workflows
      # generating notes on one tag append two copies of "What's Changed".
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v8.0.1
        with:
          name: deb
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v8.0.1
        with:
          name: macos-tarball
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v8.0.1
        with:
          name: msi
          path: dist

      # generate_release_notes appends the auto-generated changelog after this
      # body. The install section is written by hand because the generated
      # notes only ever list merged PRs, and someone arriving at the release
      # page needs to be told that Homebrew exists — the tap is re-pinned by
      # the job below, so brew is the channel that keeps itself current and
      # these files are for people who do not use it.
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            **Homebrew** — macOS and Linux, and the channel that upgrades
            itself. The tap is re-pinned automatically by this release:

            ```
            brew install curtisgalloway/tap/oxbox
            brew upgrade curtisgalloway/tap/oxbox
            ```

            **macOS without Homebrew** — `oxbox-${{ needs.version.outputs.version }}-macos.tar.gz`
            below. `bin/` beside `share/`, so it runs from wherever you
            unpack it, or copy the contents over a prefix on `PATH`:

            ```
            tar xzf oxbox-${{ needs.version.outputs.version }}-macos.tar.gz
            sudo cp -R oxbox-${{ needs.version.outputs.version }}-macos/ /usr/local/
            ```

            **Windows** — `oxbox-${{ needs.version.outputs.version }}.msi` below.
            A per-user install: no elevation, and it puts the tools on your
            PATH. Python 3.9+ has to be present, which winget will handle:

            ```
            winget install Python.Python.3.13
            msiexec /i oxbox-${{ needs.version.outputs.version }}.msi /qn
            ```

            There is no jail on native Windows and `oxbox` refuses rather
            than pretending to sandbox anything, so `ox`, `oxseed` and
            `oxapply` are fully usable and *running* model output means WSL2,
            where the Linux backend works unchanged.

            **Debian/Ubuntu** — `oxbox_${{ needs.version.outputs.version }}_all.deb` below.
            `bubblewrap` is a hard dependency: without it there is no jail and
            `oxbox` refuses to run.

            ```
            sudo apt install ./oxbox_${{ needs.version.outputs.version }}_all.deb
            ```

            Every package here was installed and smoke-tested by the workflow
            that built it, including the full in-jail probe suite against the
            installed tools. The suites themselves are not packaged — they
            assert against a checkout's layout, so verifying the jail on your
            own machine stays a `git clone` away.

  bump-tap:
    name: bump Homebrew tap
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Tell the tap to re-pin its formula. The tap workflow does the actual
      # edit with its own GITHUB_TOKEN — this only needs permission to fire
      # the dispatch, which the default token can't do cross-repo.
      # HOMEBREW_TAP_DISPATCH_TOKEN is a fine-grained PAT with Contents:write
      # on curtisgalloway/homebrew-tap. Absent, skip rather than fail: the
      # tap's workflow_dispatch covers the manual path.
      - name: Dispatch formula bump to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_DISPATCH_TOKEN not set — skipping tap bump." \
                 "Run the tap's 'Bump oxbox formula' workflow by hand instead."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/curtisgalloway/homebrew-tap/dispatches \
            -d "{\"event_type\":\"oxbox-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
          echo "Dispatched oxbox-release (${TAG}) to homebrew-tap."

  winget:
    name: publish to winget
    # Gated on a repo VARIABLE, not just on the tag and the token, because a
    # job is set up -- and its actions resolved -- before any step-level `if`
    # can skip it. That setup FAILS here: winget-releaser calls
    # cargo-bins/cargo-binstall@main internally, and this repo's Actions policy
    # requires every action pinned to a full-length SHA, which a transitive
    # @main reference is not. v0.4.0 shipped correctly with a red run for
    # exactly this: the release published, the tap re-pinned, and this job died
    # in "Set up job" having done nothing.
    #
    # So the job does not exist until someone sets WINGET_PUBLISH=true, and
    # whoever does has to first resolve that conflict -- either allow-list the
    # transitive action in the repo's Actions settings, or drop winget-releaser
    # for komac invoked directly from a pinned step. Tag-only and no
    # prereleases still apply: a hyphenated tag is not something to push at
    # everyone running `winget upgrade`.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && vars.WINGET_PUBLISH == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The secrets context is not allowed in a step `if` — it is a parse
      # error that invalidates the whole workflow — so the token is tested
      # through env instead.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # The action opens a PR against microsoft/winget-pkgs. It can only
      # UPDATE a package that already exists: the first version has to be
      # submitted by hand with `wingetcreate new` against the release's MSI
      # URL, authored with `Scope: user` so winget's upgrade detection agrees
      # with a per-user MSI (winget-cli#3011). WINGET_TOKEN is a classic PAT
      # with public_repo, which the action uses to fork and open the PR.
      - name: Publish to winget (update PR)
        if: ${{ env.WINGET_TOKEN != '' }}
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: CurtisGalloway.Oxbox
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Skipped (no WINGET_TOKEN)
        if: ${{ env.WINGET_TOKEN == '' }}
        run: |
          echo "::warning::WINGET_TOKEN not set — skipping the winget update PR." \
               "Submit the first manifest by hand with wingetcreate, then set the token."

# nfpm manifest for the Linux .deb (built by .github/workflows/release.yml,
# once per architecture inside a debian:bookworm container so the binaries
# link against a glibc every supported Debian and Ubuntu carries).
# VERSION and ARCH are injected as environment variables by the workflow:
# the package version and the Debian architecture name (amd64 or arm64).
# The binaries come from target/release, spelled out because nfpm expands
# variables in its metadata fields but not in content paths.
#
# Layout matches what the tools expect when installed (see helper_dirs and
# the skill lookup in oxbox-core): oxbox on PATH, the four helpers it runs in
# /usr/libexec/oxbox/bin, and shared data under /usr/share/oxbox — though
# the seatbelt profile is macOS-only, so the Linux .deb does not ship it; the
# Linux jail is bubblewrap, listed as a hard dependency because without it
# there is no jail and oxbox refuses to run.
#
# Not packaged: the test suites (guardtest/wiretest/jailtest). They assert
# against a source checkout's layout; verifying the jail on a new machine is
# a git-clone operation, and README says so.
#
# Packaged, though it is not an executable: the oxbox-review skill, because
# `oxbox --skill` has to find it on an installed system as well as in a
# checkout. Its helper scripts are Python, which is why python3 is
# recommended rather than depended on: the five tools themselves need no
# interpreter.

name: oxbox
arch: ${ARCH}
version: ${VERSION}
platform: linux
section: utils
priority: optional
maintainer: Curtis Galloway <4055365+curtisgalloway@users.noreply.github.com>
homepage: https://github.com/curtisgalloway/oxbox
license: Apache-2.0
description: |
  Supervised harness for pointing an untrusted LLM at your code.
  No tools, no shell, no network path back to your machine: oxbox send
  talks to the model (text in, text out, full audit log), oxbox sandbox
  builds a disposable copy, oxbox patch quarantines its patches into the
  sandbox, and oxbox jail executes the result under bubblewrap with no
  network and no writes outside the sandbox.
depends:
  - bubblewrap
  - git
recommends:
  - python3
contents:
  - src: target/release/oxbox
    dst: /usr/bin/oxbox
    file_info:
      mode: 0o755
  # The helpers live off PATH. oxbox finds them at <prefix>/libexec/oxbox/bin
  # from its own location (helper_dirs); `oxbox <sub>` execs oxbox-<sub>,
  # and `oxbox helper <sub>` runs one directly.
  - src: target/release/oxbox-sandbox
    dst: /usr/libexec/oxbox/bin/oxbox-sandbox
    file_info:
      mode: 0o755
  - src: target/release/oxbox-send
    dst: /usr/libexec/oxbox/bin/oxbox-send
    file_info:
      mode: 0o755
  - src: target/release/oxbox-patch
    dst: /usr/libexec/oxbox/bin/oxbox-patch
    file_info:
      mode: 0o755
  - src: target/release/oxbox-jail
    dst: /usr/libexec/oxbox/bin/oxbox-jail
    file_info:
      mode: 0o755
  # The oxbox-review agent skill. `oxbox --skill` prints it, and looks for it
  # here when installed — the same rule oxbox-jail uses for jail.sb. A
  # package that ships the tools without it turns --skill into a refusal, so
  # the release smoke test runs --skill against the installed copy.
  - src: .claude/skills/oxbox-review/SKILL.md
    dst: /usr/share/oxbox/oxbox-review/SKILL.md
  - src: .claude/skills/oxbox-review/scripts/preflight.py
    dst: /usr/share/oxbox/oxbox-review/scripts/preflight.py
    file_info:
      mode: 0o755
  - src: .claude/skills/oxbox-review/scripts/exposure.py
    dst: /usr/share/oxbox/oxbox-review/scripts/exposure.py
    file_info:
      mode: 0o755
  - src: .claude/skills/oxbox-review/scripts/oxreview.py
    dst: /usr/share/oxbox/oxbox-review/scripts/oxreview.py
    file_info:
      mode: 0o755
  - src: LICENSE
    dst: /usr/share/doc/oxbox/LICENSE
  - src: README.md
    dst: /usr/share/doc/oxbox/README.md
  # Under docs/ beside the README, so the README's relative link to it
  # resolves in the installed copy the same as on GitHub.
  - src: docs/comparison.md
    dst: /usr/share/doc/oxbox/docs/comparison.md
